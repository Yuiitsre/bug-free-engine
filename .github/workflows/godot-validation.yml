name: Lyrenthos Godot Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3             -o godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Run Python content validation
        run: |
          python3 -m venv .ci_venv
          . .ci_venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          python tools/bootstrap.py --project-root "$GITHUB_WORKSPACE" --build

      - name: Parse and load Godot project
        run: |
          set -o pipefail
          godot/Godot_v4.7.2-stable_linux.x86_64             --headless             --path "$GITHUB_WORKSPACE"             --editor             --quit-after 3 2>&1 | tee godot_validation.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*script" godot_validation.log; then
            echo "Godot validation found script errors."
            exit 1
          fi

      - name: Run Lyrenthos scene headlessly
        run: |
          set -o pipefail
          godot/Godot_v4.7.2-stable_linux.x86_64             --headless             --path "$GITHUB_WORKSPACE"             --quit-after 6 2>&1 | tee godot_runtime.log
          if grep -Eiq "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:.*script" godot_runtime.log; then
            echo "Godot runtime validation found script errors."
            exit 1
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-log
          path: godot_validation.log
